<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f8f8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Assiette"><meta name="description" content="Planification alimentaire personnelle — locale et sans abonnement">
<title>Assiette — Mon alimentation</title>
<style>:root{color-scheme:light;--bg:#f6f8f8;--surface:#fff;--ink:#162628;--muted:#718083;--line:#e5e9e9;--green:#119e80;--green-light:#e5f5ef;--teal:#087f67;--amber:#bf7a24;--shadow:0 6px 24px rgba(20,53,47,.045);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;color:var(--ink);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}a{color:var(--teal)}.app{max-width:720px;margin:auto;min-height:100dvh;padding:0 20px 124px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 2px 16px}.brand{display:flex;align-items:center;gap:10px;font-weight:790;font-size:21px;letter-spacing:-.6px}.brand-mark{display:grid;place-items:center;background:var(--green);color:white;width:34px;height:34px;border-radius:12px;font-size:26px}.mode-pill{background:var(--green-light);color:var(--teal);font-size:11px;font-weight:700;border-radius:30px;padding:9px 11px}.mode-dot{display:inline-block;background:var(--green);width:6px;height:6px;border-radius:99px;vertical-align:2px}.eyebrow{font-size:11px;letter-spacing:1.6px;font-weight:760;color:var(--green);text-transform:uppercase;margin-bottom:5px}.pagehead{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:8px 0 19px}.pagehead h1{font-size:37px;line-height:1.13;letter-spacing:-1.6px;margin:0}.pagehead .sub{margin:7px 0 0;color:var(--muted);font-size:14px}.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;padding:11px 13px;font-weight:650}.date-input{width:146px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:10px 8px;font-size:13px;max-width:45vw}.card{background:var(--surface);border:1px solid var(--line);border-radius:23px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}.card-title{font-size:20px;letter-spacing:-.5px;margin:0;font-weight:790}.headline{display:flex;justify-content:space-between;align-items:center;margin:23px 2px 13px}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.kcal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center;margin-bottom:20px}.kcal-grid .value{font-size:32px;letter-spacing:-1.3px;font-weight:800;line-height:1.1}.kcal-grid .cap{font-size:12px;color:var(--muted);margin-top:7px}.kcal-grid .value.green{color:var(--green)}.kcal-grid .value.amber{color:var(--amber)}.bar{height:8px;background:#e9eeee;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:var(--green);border-radius:20px;transition:width .22s}.bar.over>div{background:var(--amber)}.progressline{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:9px}.progressline strong{font-size:14px}.progressline .quant{font-size:13px;font-weight:650}.macro-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:22px}.macro .label{font-size:12px;color:var(--muted);margin-bottom:10px}.macro .quant{font-size:12px;margin-top:7px;font-weight:710}.section-note{font-size:12px;color:var(--muted);margin:-7px 3px 14px}.meal{padding:16px 0;border-bottom:1px solid var(--line)}.meal:last-child{border-bottom:0;padding-bottom:0}.meal:first-child{padding-top:0}.meal-head{display:flex;gap:12px;align-items:center}.meal-emoji{flex:0 0 46px;height:46px;display:grid;place-items:center;background:#f1f6f4;border-radius:15px;font-size:24px}.meal-title{flex:1;min-width:0}.meal-title strong{display:block;font-size:16px}.meal-title .detail{font-size:12px;color:var(--muted);margin-top:3px}.add-btn{border:0;width:39px;height:39px;flex:0 0 39px;border-radius:13px;background:#142629;color:white;font-size:25px;display:grid;place-items:center}.food-row{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:10px 0 0 58px;padding:9px 0;border-top:1px dashed var(--line)}.food-row .fn{font-weight:650;font-size:13px;overflow-wrap:anywhere}.food-row .fd{font-size:11px;color:var(--muted);margin-top:4px}.pill{display:inline-block;background:var(--green-light);color:var(--teal);border-radius:6px;padding:3px 6px;font-size:10px;font-weight:750}.pill.planned{background:#f2efff;color:#7159ad}.iconbtn{border:0;background:#f3f5f5;border-radius:9px;min-width:33px;height:33px;font-weight:700}.iconbtn.del{color:#c04646}.tabs{display:flex;position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);background:rgba(255,255,255,.94);backdrop-filter:blur(22px);border-top:1px solid var(--line);padding:11px 12px calc(11px + env(safe-area-inset-bottom));justify-content:space-around}.tab{background:transparent;border:0;display:flex;flex-direction:column;gap:4px;align-items:center;color:#8b9698;min-width:68px;font-size:10px;font-weight:680}.navico{font-size:24px;line-height:29px}.tab.active{color:var(--teal)}.primary{background:var(--green);color:white;border:0;border-radius:14px;font-weight:760;padding:14px 18px}.secondary{background:var(--green-light);color:var(--teal);border:0;border-radius:14px;font-weight:750;padding:13px 15px}.danger{background:#fcf0f0;color:#b42d39;border:0;border-radius:14px;font-weight:750;padding:13px 15px}.wfull{width:100%}.row{display:flex;align-items:center;gap:9px}.spread{justify-content:space-between}.stack{display:grid;gap:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:680;color:var(--muted)}.field input,.field select{background:var(--surface);border:1px solid #dbe1e1;border-radius:12px;padding:12px;color:var(--ink);min-width:0;width:100%;font-size:16px}.field.full{grid-column:1/-1}input:focus,select:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}.empty{padding:35px 13px;text-align:center;color:var(--muted)}.empty .symbol{font-size:33px;display:block;margin-bottom:12px}.cardrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.cardrow:last-child{border-bottom:0}.cardrow strong{font-size:14px}.badge{background:#ecf1f0;border-radius:100px;padding:5px 9px;font-size:11px;color:var(--muted)}.datechips{display:flex;gap:7px;overflow:auto;padding-bottom:4px;scrollbar-width:none}.datechip{flex:1;min-width:56px;border:1px solid var(--line);border-radius:15px;background:white;padding:11px 7px;display:grid;gap:6px;justify-items:center;color:var(--muted)}.datechip strong{font-size:17px;color:var(--ink)}.datechip.selected{background:var(--green);border-color:var(--green);color:white}.datechip.selected strong{color:white}.overlay{position:fixed;inset:0;z-index:20;background:rgba(11,28,29,.38);display:flex;align-items:end;justify-content:center}.sheet{background:var(--bg);width:min(100%,720px);border-radius:26px 26px 0 0;max-height:94dvh;overflow:auto;padding:23px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(0,0,0,.1)}.sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.sheet-header h2{font-size:22px;letter-spacing:-.5px;margin:0}.close{border:none;background:white;border-radius:12px;padding:8px 12px;font-size:20px}.hint{border-radius:12px;background:#ecf4f1;color:#466a5f;padding:12px;font-size:12px;line-height:1.5}.searchresult{background:white;border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;width:100%;text-align:left}.searchresult strong{font-size:13px}.searchresult small{display:block;color:var(--muted);margin-top:5px}.segmented{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#e8eeec;border-radius:13px;padding:4px}.segmented button{border:0;border-radius:10px;padding:10px;background:transparent;color:var(--muted);font-weight:720}.segmented button.selected{background:#fff;color:var(--ink);box-shadow:0 2px 8px #172c2910}.notice{font-size:11px;color:var(--muted);line-height:1.5}.actionbar{display:flex;gap:9px;flex-wrap:wrap}.actionbar>*{flex:1}.day-title{font-size:17px;font-weight:800;letter-spacing:-.4px}.disclaimer{padding:14px 16px;font-size:11px;color:var(--muted);text-align:center;line-height:1.55}.divider{height:1px;background:var(--line);margin:15px 0}#toast{position:fixed;bottom:100px;left:50%;transform:translate(-50%,20px);padding:12px 17px;background:#142629;border-radius:13px;color:white;font-size:13px;font-weight:640;z-index:55;opacity:0;pointer-events:none;transition:.2s;min-width:170px;text-align:center}#toast.shown{opacity:1;transform:translate(-50%,0)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101718;--surface:#1b2425;--ink:#ecf5f2;--muted:#9daead;--line:#303c3c;--green:#3aceab;--green-light:#193c35;--teal:#6de1bd;--amber:#ebb45d;--shadow:0 6px 24px rgba(0,0,0,.08)}.mode-pill{background:#183d34}.bar{background:#3d4848}.meal-emoji,.iconbtn{background:#283334;color:#e9f3f3}.add-btn{background:#d9efea;color:#172c29}.tabs{background:rgba(21,31,32,.95)}.datechip{background:var(--surface)}.datechip.selected{background:#146f5a}.badge{background:#283737}.segmented{background:#2c3736}.segmented button.selected{background:#43514f;color:#fff}.hint{background:#203d37;color:#a8dccc}.searchresult{background:var(--surface)}.close{background:var(--surface);color:var(--ink)}}

/* Aliments favoris : tuiles compactes, scroll horizontal iPhone. */
.quick-section{margin:22px 0 23px}.quick-title{margin-top:0;margin-bottom:10px}.quick-title h2{font-size:19px}.quick-list{display:grid;grid-auto-flow:column;grid-auto-columns:164px;gap:9px;overflow-x:auto;scroll-snap-type:x proximity;padding:0 2px 12px;margin:0 -2px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}.quick-tile{min-height:122px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:7px;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:19px;padding:13px 13px 11px;scroll-snap-align:start;box-shadow:var(--shadow)}.quick-tile .qicon{font-size:25px;line-height:27px}.quick-tile .qname{font-size:13px;font-weight:730;line-height:1.24;max-height:34px;overflow:hidden}.quick-tile .qamount{margin-top:auto;font-size:11px;color:var(--teal);font-weight:730}.quick-section .notice{margin:0 3px}.quick-picker{grid-auto-columns:156px;margin:4px 0}.quick-picker .quick-tile{min-height:113px}.quick-tile:focus-visible{outline:3px solid var(--teal);outline-offset:2px}@media(min-width:720px){.quick-list{grid-auto-columns:170px}}
</style>

<body>
<div class="app">
  <header class="topbar"><div class="brand"><span class="brand-mark">◒</span><span>Assiette</span></div><div class="mode-pill"><span class="mode-dot"></span> Données locales</div></header>
  <main id="main" aria-live="polite"></main>
  <nav class="tabs" aria-label="Navigation principale"><button data-tab="today" class="tab active"><span class="navico">◉</span><span>Aujourd'hui</span></button><button data-tab="plan" class="tab"><span class="navico">▦</span><span>Planifier</span></button><button data-tab="history" class="tab"><span class="navico">▥</span><span>Historique</span></button><button data-tab="settings" class="tab"><span class="navico">⚙</span><span>Réglages</span></button></nav>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>'use strict';
const STORE='assiette-donnees-v1';const DEFAULT={version:1,goals:{kcal:1900,protein:150,carbs:215,fat:50},foods:[],entries:[]};
const MEALS=[['breakfast','Petit déjeuner','☕'],['lunch','Déjeuner','🥗'],['dinner','Dîner','🍽️'],['dessert','Dessert / Collation','🍎']];
// Ce sont des raccourcis de saisie, PAS des fiches nutritionnelles certifiées.
// Les chiffres des produits sont renseignés à partir des emballages par l'utilisateur et mémorisés ensuite.
const QUICK_FOODS=[
  {id:'poulet',name:'Poulet cru',amount:300,unit:'g',icon:'🍗',meal:'dinner'},
  {id:'avoine',name:'Flocons d’avoine',amount:100,unit:'g',icon:'🌾',meal:'breakfast'},
  {id:'amande',name:'Lait d’amandes sans sucre',amount:400,unit:'ml',icon:'🥛',meal:'breakfast'},
  {id:'riz',name:'Riz basmati cru',amount:200,unit:'g',icon:'🍚',meal:'dinner'},
  {id:'whey',name:'Whey ESN (référence à préciser)',brand:'ESN',amount:30,unit:'g',icon:'🥤',meal:'breakfast'},
  {id:'huile',name:'Huile d’olive',amount:10,unit:'ml',icon:'🫒',meal:'dinner'},
  {id:'fromage',name:'Fromage blanc 0 %',amount:300,unit:'g',icon:'🥣',meal:'dessert'},
  {id:'poivron',name:'Poivron vert cru',amount:250,unit:'g',icon:'🫑',meal:'dinner'},
  {id:'courgette',name:'Courgette crue',amount:300,unit:'g',icon:'🥒',meal:'dinner'},
  {id:'champignon',name:'Champignons crus',amount:150,unit:'g',icon:'🍄',meal:'dinner'},
  {id:'popcorn',name:'Maïs à popcorn',amount:100,unit:'g',icon:'🌽',meal:'dessert'},
  {id:'pomme',name:'Pommes de terre crues',amount:500,unit:'g',icon:'🥔',meal:'dinner'},
  {id:'oeuf',name:'Œuf entier',amount:1,unit:'pièce',icon:'🥚',meal:'breakfast'},
  {id:'blanc',name:'Blanc d’œuf',amount:100,unit:'g',icon:'🍳',meal:'breakfast'}
];
function unitOf(x){return ['g','ml','pièce'].includes(x?.unit)?x.unit:'g';}
function portion(x){return `${fmt(x.grams??x.amount??100,1)} ${unitOf(x)}`;}
function quickById(id){return QUICK_FOODS.find(p=>p.id===id);}
function resolvedPreset(p){return db.foods.find(f=>f.presetId===p.id)||null;}
function completeNutrition(f){return ['kcal','protein','carbs','fat'].every(k=>numeric(f?.per?.[k])!==null);}
function quickTile(p){let found=resolvedPreset(p),ok=completeNutrition(found);return `<button class="quick-tile" data-action="quick" data-preset="${p.id}" title="${ok?'Ajouter en un geste':'Renseigner les valeurs une seule fois'}"><span class="qicon">${p.icon}</span><span class="qname">${safe(found?.name||p.name)}</span><span class="qamount">${fmt(p.amount)} ${p.unit}${ok?' · +':' · à compléter'}</span></button>`;}
function quickSection(compact=false){return `<section class="quick-section"><div class="headline quick-title"><h2 class="card-title">Mes essentiels</h2><span class="badge">14 aliments · portions prêtes</span></div><div class="quick-list ${compact?'quick-compact':''}">${QUICK_FOODS.map(quickTile).join('')}</div><p class="notice">Une fois les valeurs nutritionnelles renseignées, un toucher ajoute la portion prévue. Les quantités restent modifiables.</p></section>`;}
function quickAdd(id,overrideMeal){const p=quickById(id);if(!p)return;const meal=overrideMeal||p.meal;
 const stored=resolvedPreset(p);if(stored&&completeNutrition(stored)&&unitOf(stored)===p.unit){db.entries.push({id:uid(),date:day,meal,status:tab==='plan'?'planned':'eaten',name:stored.name,brand:stored.brand||'',grams:p.amount,unit:p.unit,per:clone(stored.per)});save();if(modal)closeModal();render();notify(`${p.name} · ${p.amount} ${p.unit} ajouté`);return;}
 modal={meal};editor({name:stored?.name||p.name,brand:stored?.brand||p.brand||'',grams:p.amount,unit:p.unit,per:stored?.per||{kcal:null,protein:null,carbs:null,fat:null},presetId:p.id});}

let db=load(),tab='today',day=isoDate(new Date()),modal=null,offResults=[],searchTerm='',searchStatus='';
function clone(x){return JSON.parse(JSON.stringify(x));}function load(){try{let obj=JSON.parse(localStorage.getItem(STORE));if(obj&&Array.isArray(obj.entries)&&Array.isArray(obj.foods)&&obj.goals&&obj.version===1)return obj;}catch(e){}return clone(DEFAULT)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(db));return true;}catch(e){notify('Stockage indisponible : exporte tes données');return false;}}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function numeric(v){if(v===null||v===''||v===undefined)return null;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)&&n>=0?n:null;}
function fmt(n,dec=0){return Number(n||0).toLocaleString('fr-FR',{maximumFractionDigits:dec,minimumFractionDigits:0});}function isoDate(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;}
function fromISO(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d,12,0,0);}
function addDays(s,n){let d=fromISO(s);d.setDate(d.getDate()+n);return isoDate(d)}
function dateFmt(s,opt={weekday:'long',day:'numeric',month:'long'}){return new Intl.DateTimeFormat('fr-FR',opt).format(fromISO(s));}
function uid(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);}
function getEntries(date){return db.entries.filter(e=>e.date===date);}function perFor(e){return e.per||{kcal:0,protein:0,carbs:0,fat:0};}
function sums(entries){const total={kcal:0,protein:0,carbs:0,fat:0,partial:false};for(const e of entries){for(const k of ['kcal','protein','carbs','fat']){let v=numeric(perFor(e)[k]);if(v===null){total.partial=true;continue;}total[k]+=v*(Number(e.grams)||0)/(unitOf(e)==='pièce'?1:100);}}return total;}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('shown');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.remove('shown'),3000);}
function progress(value,goal){let ratio=goal>0?value/goal:0;return `<div class="bar ${ratio>1?'over':''}"><div style="width:${Math.max(0,Math.min(100,ratio*100))}%"></div></div>`;}
function viewHeader(title,subtitle,dateControl=true){return `<div class="pagehead"><div><div class="eyebrow">Mon journal alimentaire</div><h1>${safe(title)}</h1><p class="sub">${safe(subtitle)}</p></div>${dateControl?`<input class="date-input" type="date" id="date-control" value="${day}" aria-label="Choisir la date">`:''}</div>`;}
function summary(date){const eaten=getEntries(date).filter(x=>x.status==='eaten'), planned=getEntries(date).filter(x=>x.status==='planned');const t=sums(eaten),g=db.goals,remaining=(g.kcal-t.kcal);return `<section class="card" aria-label="Résumé nutritionnel"><div class="kcal-grid"><div><div class="value">${fmt(t.kcal)}</div><div class="cap">Mangé · kcal</div></div><div><div class="value ${remaining>=0?'green':'amber'}">${remaining<0?'−':''}${fmt(Math.abs(remaining))}</div><div class="cap">${remaining>=0?'Restantes':'En dépassement'}</div></div><div><div class="value">${fmt(g.kcal)}</div><div class="cap">Objectif · kcal</div></div></div>${progress(t.kcal,g.kcal)}<div class="macro-grid">${[['carbs','Glucides'],['protein','Protéines'],['fat','Lipides']].map(([k,label])=>`<div class="macro"><div class="label">${label}</div>${progress(t[k],g[k])}<div class="quant">${fmt(t[k],1)} / ${fmt(g[k])} g</div></div>`).join('')}</div>${t.partial?'<div class="notice" style="margin-top:12px">Certaines valeurs nutritionnelles manquent : totaux potentiellement incomplets.</div>':''}${planned.length?`<div class="hint" style="margin-top:16px">${planned.length} aliment(s) planifié(s) : non comptabilisés tant qu’ils ne sont pas marqués comme consommés.</div>`:''}</section>`;}
function mealSection(date,meal){const [key,title,emoji]=meal;const list=getEntries(date).filter(e=>e.meal===key);const spent=sums(list.filter(e=>e.status==='eaten'));const planned=sums(list.filter(e=>e.status==='planned'));return `<article class="meal"><div class="meal-head"><div class="meal-emoji" aria-hidden="true">${emoji}</div><div class="meal-title"><strong>${title}</strong><div class="detail">${fmt(spent.kcal)} kcal consommées${planned.kcal?` · ${fmt(planned.kcal)} prévues`:''}</div></div><button class="add-btn" aria-label="Ajouter à ${title}" data-action="add" data-meal="${key}">+</button></div>${list.map(e=>`<div class="food-row"><div style="min-width:0;flex:1"><div class="fn">${safe(e.name)} ${e.brand?`<span class="muted">· ${safe(e.brand)}</span>`:''}</div><div class="fd">${portion(e)} · ${completeNutrition(e)?fmt(sums([e]).kcal)+' kcal':'macros à compléter'} <span class="pill ${e.status==='planned'?'planned':''}">${e.status==='planned'?'Prévu':'Mangé'}</span></div></div><button data-action="toggle" data-id="${safe(e.id)}" class="iconbtn" aria-label="Basculer prévu et mangé">${e.status==='planned'?'✓':'↶'}</button><button data-action="edit" data-id="${safe(e.id)}" class="iconbtn" aria-label="Modifier">✎</button><button data-action="delete" data-id="${safe(e.id)}" class="iconbtn del" aria-label="Supprimer">×</button></div>`).join('')}${!list.length?'<div class="small muted" style="margin:12px 0 0 58px">Aucun aliment enregistré</div>':''}</article>`;}
function meals(date){return `<div class="headline"><h2 class="card-title">Alimentation</h2><span class="badge">4 repas</span></div><section class="card">${MEALS.map(m=>mealSection(date,m)).join('')}</section>`;}
function todayView(){return `${viewHeader(day===isoDate(new Date())?'Aujourd’hui':dateFmt(day,{day:'numeric',month:'long'}),dateFmt(day))}${summary(day)}${quickSection(true)}${meals(day)}<p class="disclaimer">Les données restent sur cet appareil et dans ce navigateur. Pense à faire un export de sauvegarde.</p>`;}
function planView(){let chips=Array.from({length:7},(_,i)=>addDays(day,i-2));const expected=getEntries(day).filter(e=>e.status==='planned');return `${viewHeader('Planifier','Préparer tes repas, puis les valider comme mangés')}<div class="datechips">${chips.map(d=>`<button class="datechip ${d===day?'selected':''}" data-action="date" data-date="${d}"><span class="tiny">${dateFmt(d,{weekday:'short'})}</span><strong>${fromISO(d).getDate()}</strong></button>`).join('')}</div><div class="headline"><h2 class="card-title">Repas du ${dateFmt(day,{day:'numeric',month:'long'})}</h2></div><div class="card"><div class="actionbar"><button class="secondary" data-action="copyPrevious">Copier la veille</button><button class="ghost" data-action="copyNext">Copier vers demain</button></div><p class="notice">La copie ajoute des repas prévus, sans écraser ceux déjà enregistrés.</p></div>${summary(day)}${quickSection(true)}${meals(day)}${expected.length?`<p class="notice">${expected.length} aliment(s) restent planifiés pour cette journée.</p>`:''}`;}
function historyView(){const dates=[...new Set(db.entries.map(e=>e.date))].sort().reverse();return `${viewHeader('Historique','Tes journées enregistrées',false)}${!dates.length?'<div class="card empty"><span class="symbol">🗓️</span>Pas encore de repas enregistrés.<br>Ajoute un aliment dans « Aujourd’hui » pour commencer.</div>':`<div class="card">${dates.map(d=>{let rows=getEntries(d),t=sums(rows.filter(x=>x.status==='eaten')),p=rows.filter(x=>x.status==='planned').length;return `<button class="searchresult" style="border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0" data-action="openDate" data-date="${d}"><span><strong>${safe(dateFmt(d))}</strong><small>${rows.length} aliment(s) · ${p} prévu(s)</small></span><strong>${fmt(t.kcal)} kcal ›</strong></button>`}).join('')}</div>`}<p class="disclaimer">L’historique est stocké localement, sans compte ni synchronisation.</p>`;}
function settingsView(){const g=db.goals;return `${viewHeader('Réglages','Objectifs et sauvegardes',false)}<section class="card"><h2 class="card-title">Mes objectifs</h2><p class="section-note" style="margin-top:8px">Modifie tes cibles selon tes besoins.</p><form id="settings-form" class="form-grid">${[['kcal','Calories (kcal)'],['protein','Protéines (g)'],['carbs','Glucides (g)'],['fat','Lipides (g)']].map(([k,l])=>`<div class="field"><label for="goal-${k}">${l}</label><input id="goal-${k}" name="${k}" type="number" min="0" max="20000" step="1" required value="${safe(g[k])}"></div>`).join('')}<button type="submit" class="primary wfull" style="grid-column:1/-1">Enregistrer les objectifs</button></form></section><section class="card"><h2 class="card-title">Mes données</h2><p class="notice">Export conseillé après chaque semaine de saisie. Les données ne quittent pas ton navigateur, sauf si tu choisis de les exporter.</p><div class="stack"><button class="secondary wfull" data-action="exportJson">Exporter une sauvegarde JSON</button><button class="ghost wfull" data-action="exportCsv">Exporter le journal CSV</button><div class="field"><label for="import-file">Restaurer une sauvegarde JSON</label><input id="import-file" type="file" accept=".json,application/json"></div><button class="danger wfull" data-action="reset">Effacer toutes mes données locales</button></div></section><div class="hint">🔒 V1 sans compte ni abonnement. Pas de synchronisation YAZIO, Apple Santé ou ChatGPT. Pour un accès ChatGPT sécurisé, il faudra ultérieurement un serveur et un connecteur autorisé.</div>`;}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('main').innerHTML=({today:todayView,plan:planView,history:historyView,settings:settingsView}[tab]||todayView)();}
function closeModal(){modal=null;document.getElementById('modal-root').innerHTML='';}
function showModal(html){document.getElementById('modal-root').innerHTML=`<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="Ajouter un aliment">${html}</div></div>`;}
function panelHeader(title){return `<div class="sheet-header"><h2>${title}</h2><button class="close" data-action="close" aria-label="Fermer">×</button></div>`;}
function addModal(meal,selected=null){modal={type:'add',meal,selected};searchStatus='';searchTerm='';offResults=[];drawPicker();}
function drawPicker(){if(!modal||modal.type!=='add')return;const own=db.foods.filter(f=>(f.name+' '+(f.brand||'')).toLowerCase().includes(searchTerm.toLowerCase()));showModal(`${panelHeader('Ajouter un aliment')}<div class="field"><label for="food-query">Rechercher un produit ou un favori</label><input id="food-query" placeholder="Ex. riz, skyr, chocolat…" value="${safe(searchTerm)}" autocomplete="off"></div><div class="actionbar" style="margin-top:12px"><button class="secondary" data-action="searchOFF">Chercher dans Open Food Facts</button><button class="ghost" data-action="manual">Créer un aliment</button></div><p class="notice">Les recherches en ligne nécessitent Internet et peuvent être limitées par Open Food Facts. Les valeurs doivent être vérifiées sur l’emballage.</p><div id="search-status" class="notice">${safe(searchStatus)}</div><div class="headline"><h3 class="card-title">Mes essentiels</h3><span class="badge">Portions préparées</span></div><div class="quick-list quick-picker">${QUICK_FOODS.filter(p=>(p.name+' '+(p.brand||'')).toLowerCase().includes(searchTerm.toLowerCase())).map(quickTile).join('')}</div><div class="headline"><h3 class="card-title">Mes aliments</h3><span class="badge">${own.length}</span></div><div id="own-results">${own.map(f=>foodResult(f,'own')).join('')||'<p class="small muted">Aucun aliment personnel correspondant.</p>'}</div><div class="headline"><h3 class="card-title">Produits en ligne</h3></div><div id="off-results">${offResults.map((f,i)=>foodResult({...f,id:String(i)},'remote')).join('')}</div>`);}
function foodResult(f,source){const ok=['kcal','protein','carbs','fat'].every(k=>numeric(f.per?.[k])!==null);return `<button class="searchresult" data-action="selectFood" data-source="${source}" data-id="${safe(f.id)}"><span><strong>${safe(f.name)}${f.brand?` · ${safe(f.brand)}`:''}</strong><small>${ok?`${fmt(f.per.kcal)} kcal / ${unitOf(f)==="pièce"?"pièce":"100 "+unitOf(f)} · ${fmt(f.per.protein,1)} g protéines`:'Valeurs à renseigner une fois'}</small></span><span style="font-size:21px;color:var(--green)">＋</span></button>`;}
function numericField(k,label,val='',step='.1',required=true){return `<div class="field"><label for="v-${k}">${label}</label><input id="v-${k}" name="${k}" type="number" inputmode="decimal" min="0" step="${step}" ${required?'required':''} value="${val!==null&&val!==undefined?safe(val):''}"></div>`;}
function editor(food=null,existingId=null){const e=existingId?db.entries.find(x=>x.id===existingId):null;const source=e||food||{name:'',brand:'',grams:100,per:{kcal:null,protein:null,carbs:null,fat:null}};const p=source.per||{};modal={type:'editor',meal:e?.meal||modal?.meal||'breakfast',existingId,sourceFoodId:food?.id||null,source};showModal(`${panelHeader(existingId?'Modifier un aliment':'Enregistrer un aliment')}<form id="food-form" class="stack"><div class="form-grid"><div class="field full"><label>Nom de l’aliment</label><input name="name" maxlength="120" required placeholder="Ex. riz basmati cuit" value="${safe(source.name)}"></div><div class="field full"><label>Marque (facultatif)</label><input name="brand" maxlength="80" placeholder="Ex. marque du produit" value="${safe(source.brand||'')}"></div><div class="field"><label>Repas</label><select name="meal">${MEALS.map(([k,l])=>`<option value="${k}" ${k===modal.meal?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label for="food-unit">Unité</label><select name="unit" id="food-unit"><option value="g" ${unitOf(source)==='g'?'selected':''}>g</option><option value="ml" ${unitOf(source)==='ml'?'selected':''}>ml</option><option value="pièce" ${unitOf(source)==='pièce'?'selected':''}>pièce(s)</option></select></div>${numericField('grams','Quantité',source.grams??100,'0.1')}<div class="field full"><label>État</label><select name="status"><option value="eaten" ${source.status==='eaten'||(!e&&tab!=='plan')?'selected':''}>Mangé</option><option value="planned" ${source.status==='planned'||(!e&&tab==='plan')?'selected':''}>Prévu</option></select></div></div><div class="divider"></div><strong id="basis-label">Valeurs nutritionnelles ${unitOf(source)==='pièce'?'par pièce':'pour 100 '+unitOf(source)}</strong><div class="form-grid">${numericField('kcal','Calories (kcal)',p.kcal)}${numericField('protein','Protéines (g)',p.protein)}${numericField('carbs','Glucides (g)',p.carbs)}${numericField('fat','Lipides (g)',p.fat)}</div><p class="notice">Renseigne les 4 valeurs exactement comme sur l’étiquette du produit ou une source fiable. Tous les calculs sont proportionnels à la quantité.</p><button class="primary wfull" type="submit">${existingId?'Enregistrer les modifications':'Ajouter au journal'}</button></form>`);}
function parseForm(form){let vals=Object.fromEntries(new FormData(form));let name=String(vals.name||'').trim(),brand=String(vals.brand||'').trim(),grams=numeric(vals.grams);const unit=['g','ml','pièce'].includes(vals.unit)?vals.unit:'g';const per={kcal:numeric(vals.kcal),protein:numeric(vals.protein),carbs:numeric(vals.carbs),fat:numeric(vals.fat)};if(!name||grams===null||grams<=0||grams>50000||Object.values(per).some(v=>v===null||v>100000)){notify('Vérifie le nom, la quantité et les 4 valeurs');return null;}return {name,brand,grams,unit,per,meal:vals.meal,status:vals.status};}
function handleFoodSave(form){const val=parseForm(form);if(!val)return;const old=modal?.existingId?db.entries.find(x=>x.id===modal.existingId):null;if(old)Object.assign(old,val);else db.entries.push({...val,date:day,id:uid()});let key=(val.name+'~'+val.brand).toLowerCase(),food=db.foods.find(f=>(f.name+'~'+f.brand).toLowerCase()===key)||(modal?.source?.presetId?db.foods.find(f=>f.presetId===modal.source.presetId):null);if(food)Object.assign(food,{per:val.per,unit:val.unit,grams:val.grams,name:val.name,brand:val.brand,presetId:modal?.source?.presetId||food.presetId});else db.foods.push({name:val.name,brand:val.brand,per:val.per,unit:val.unit,grams:val.grams,presetId:modal?.source?.presetId||null,id:uid()});save();closeModal();render();notify(old?'Aliment modifié':'Aliment enregistré');}
function changeDay(newdate){if(!/^\d{4}-\d{2}-\d{2}$/.test(newdate))return;day=newdate;render();}
function changeTab(next){tab=next;if(next==='today')day=isoDate(new Date());render();window.scrollTo(0,0);}
async function searchOFF(){let q=(document.getElementById('food-query')?.value||'').trim();if(q.length<2){notify('Entre au moins deux caractères');return;}searchTerm=q;searchStatus='Recherche en cours…';drawPicker();try{const url=`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=10&fields=code,product_name,brands,nutriments`;
const resp=await fetch(url,{headers:{'Accept':'application/json'}});if(!resp.ok)throw Error('Réponse '+resp.status);const data=await resp.json();offResults=(data.products||[]).filter(p=>p.product_name).map(p=>{let n=p.nutriments||{};const energy=n['energy-kcal_100g']??(numeric(n.energy_100g)!==null?Number(n.energy_100g)/4.184:null);return {id:p.code,name:p.product_name,brand:p.brands||'',per:{kcal:numeric(energy),protein:numeric(n.proteins_100g),carbs:numeric(n.carbohydrates_100g),fat:numeric(n.fat_100g)}}});searchStatus=`${offResults.length} produit(s) trouvés. Vérifie les valeurs.`;drawPicker();}catch(e){searchStatus='Recherche indisponible. Utilise « Créer un aliment » ou réessaie avec une connexion Internet.';drawPicker();}}
function exportJson(){download('assiette-sauvegarde-'+isoDate(new Date())+'.json',JSON.stringify({...db,exported_at:new Date().toISOString()},null,2),'application/json');}
function download(name,contents,type){const blob=new Blob([contents],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function exportCsv(){const head=['Date','Repas','Statut','Aliment','Marque','Quantité','Unité','Calories','Protéines_g','Glucides_g','Lipides_g'];const lines=[head,...db.entries.map(e=>{let s=sums([e]);return [e.date,MEALS.find(x=>x[0]===e.meal)?.[1]||e.meal,e.status,e.name,e.brand,e.grams,unitOf(e),completeNutrition(e)?s.kcal.toFixed(2):'',completeNutrition(e)?s.protein.toFixed(2):'',completeNutrition(e)?s.carbs.toFixed(2):'',completeNutrition(e)?s.fat.toFixed(2):''];})];download('assiette-journal-'+isoDate(new Date())+'.csv','\ufeff'+lines.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv');}
function copyDate(src,dst){const items=getEntries(src),existing=getEntries(dst);if(!items.length){notify('Aucun aliment à copier');return;}if(existing.length>100){notify('Trop d’aliments pour cette journée');return;}items.forEach(e=>{let item=clone(e);item.id=uid();item.date=dst;item.status='planned';db.entries.push(item);});save();render();notify(`${items.length} aliment(s) copiés comme prévus`);}
function validateImport(obj){if(!obj||obj.version!==1||!Array.isArray(obj.entries)||!Array.isArray(obj.foods)||typeof obj.goals!=='object')return false;if(obj.entries.length>150000||obj.foods.length>100000)return false;return obj.entries.every(e=>e&&typeof e.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&MEALS.some(m=>m[0]===e.meal)&&['planned','eaten'].includes(e.status)&&typeof e.name==='string'&&numeric(e.grams)!==null&&e.per&&['kcal','protein','carbs','fat'].every(k=>numeric(e.per[k])!==null))&&obj.foods.every(f=>f&&typeof f.id==='string'&&typeof f.name==='string'&&f.per)&&['kcal','protein','carbs','fat'].every(k=>numeric(obj.goals[k])!==null);}
document.addEventListener('click',async e=>{const tabBtn=e.target.closest('[data-tab]');if(tabBtn){changeTab(tabBtn.dataset.tab);return;}const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
if(action==='close'){closeModal();return;}if(action==='quick'){quickAdd(b.dataset.preset,modal?.type==='add'?modal.meal:null);return;}if(action==='add'){addModal(b.dataset.meal);return;}if(action==='manual'){editor();return;}
if(action==='selectFood'){const food=b.dataset.source==='own'?db.foods.find(f=>f.id===b.dataset.id):offResults[Number(b.dataset.id)];if(food)editor(food);return;}
if(action==='searchOFF'){await searchOFF();return;}
if(action==='date'){changeDay(b.dataset.date);return;}
if(action==='openDate'){day=b.dataset.date;tab='today';render();window.scrollTo(0,0);return;}
if(action==='delete'){if(!confirm('Supprimer cet aliment de la journée ?'))return;db.entries=db.entries.filter(x=>x.id!==b.dataset.id);save();render();notify('Aliment supprimé');return;}
if(action==='toggle'){const ent=db.entries.find(x=>x.id===b.dataset.id);if(ent){ent.status=ent.status==='planned'?'eaten':'planned';save();render();}return;}
if(action==='edit'){const ent=db.entries.find(x=>x.id===b.dataset.id);if(ent)editor(null,ent.id);return;}
if(action==='copyPrevious'){copyDate(addDays(day,-1),day);return;}
if(action==='copyNext'){copyDate(day,addDays(day,1));return;}
if(action==='exportJson'){exportJson();return;}if(action==='exportCsv'){exportCsv();return;}
if(action==='reset'){if(confirm('Effacer définitivement tous les aliments, repas et objectifs enregistrés sur ce navigateur ?')){db=clone(DEFAULT);save();render();notify('Données locales effacées');}return;}
});
document.addEventListener('submit',e=>{if(e.target.id==='food-form'){e.preventDefault();handleFoodSave(e.target);}if(e.target.id==='settings-form'){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));for(const k of ['kcal','protein','carbs','fat']){const n=numeric(v[k]);if(n===null||n>20000){notify('Objectifs invalides');return;}db.goals[k]=n;}save();render();notify('Objectifs enregistrés');}});
document.addEventListener('change',async e=>{if(e.target.id==='food-unit'){const el=document.getElementById('basis-label');if(el)el.textContent=e.target.value==='pièce'?'Valeurs nutritionnelles par pièce':'Valeurs nutritionnelles pour 100 '+e.target.value;}if(e.target.id==='date-control'){changeDay(e.target.value);}if(e.target.id==='import-file'){const file=e.target.files?.[0];if(!file)return;if(file.size>15_000_000){notify('Fichier trop volumineux');return;}try{const obj=JSON.parse(await file.text());if(!validateImport(obj)){notify('Sauvegarde invalide');return;}if(!confirm('Remplacer toutes les données locales par cette sauvegarde ?'))return;db={version:1,goals:obj.goals,entries:obj.entries,foods:obj.foods};save();render();notify('Sauvegarde restaurée');}catch(err){notify('Impossible de lire la sauvegarde');}}});
document.addEventListener('input',e=>{if(e.target.id==='food-query'){searchTerm=e.target.value;const quick=document.querySelector('.quick-picker');if(quick)quick.innerHTML=QUICK_FOODS.filter(p=>(p.name+' '+(p.brand||'')).toLowerCase().includes(searchTerm.toLowerCase())).map(quickTile).join('');const own=db.foods.filter(f=>(f.name+' '+(f.brand||'')).toLowerCase().includes(searchTerm.toLowerCase()));document.getElementById('own-results').innerHTML=own.map(f=>foodResult(f,'own')).join('')||'<p class="small muted">Aucun aliment personnel correspondant.</p>';}});
document.getElementById('modal-root').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
render();// No service worker in single-file edition; avoid caching stale assets.
</script>
</body>
</html>
